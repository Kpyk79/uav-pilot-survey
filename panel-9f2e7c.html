<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#3f5e2b" />
<title>Штаб відбору</title>
<link rel="stylesheet" href="css/survey.css?v=6">
<link rel="stylesheet" href="css/panel.css?v=6">
</head>
<body class="panel-page">

<header class="phead">
  <div class="phead__in">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.2L20 8l-4 4 1 5.6L12 15l-5 2.6 1-5.6-4-4 5.6-.8z"/></svg></span>
      <span>Штаб відбору<small>кандидати в пілоти БпЛА</small></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Розділи" hidden>
      <button class="tab is-on" role="tab" type="button" data-tab="list" aria-selected="true">Кандидати</button>
      <button class="tab" role="tab" type="button" data-tab="stats" aria-selected="false">Аналітика</button>
    </nav>
    <button class="btn ghost small" id="logoutBtn" type="button" hidden>Вийти</button>
  </div>
</header>

<main class="pmain">

  <!-- ВХІД -->
  <section class="loginbox card" id="loginBox">
    <h1 class="q">Вхід для штабу</h1>
    <p class="hint">Доступ лише для облікових записів, створених у Supabase Auth.</p>
    <form id="loginForm" class="lform">
      <label class="fld"><span class="fld__l">Email</span>
        <input class="inp" type="email" name="email" required autocomplete="username"></label>
      <label class="fld"><span class="fld__l">Пароль</span>
        <input class="inp" type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn pri big" type="submit">Увійти</button>
      <p class="msg" id="loginError" hidden></p>
    </form>
  </section>

  <!-- ПАНЕЛЬ -->
  <section id="dashboard" hidden>
    <div class="filters" id="filters">
      <label class="filter"><span>Період</span>
        <select class="inp sel" id="period">
          <option value="all">За весь час</option>
          <option value="today">Сьогодні</option>
          <option value="7">Останні 7 днів</option>
          <option value="30">Останні 30 днів</option>
        </select>
      </label>
      <div class="filter filter--grow" data-for="list">
        <span>Пошук</span>
        <input class="inp" id="search" type="search" placeholder="ПІБ, область, телефон…">
      </div>
      <label class="filter" data-for="list"><span>Сортування</span>
        <select class="inp sel" id="sortBy">
          <option value="created_at_desc">Нові спочатку</option>
          <option value="created_at_asc">Старі спочатку</option>
          <option value="score_desc">Рейтинг: вищий спочатку</option>
          <option value="name_asc">За прізвищем (А→Я)</option>
        </select>
      </label>
      <label class="filter" data-for="list"><span>Показати</span>
        <select class="inp sel" id="onlyFilter">
          <option value="all">Усіх</option>
          <option value="high">Високий потенціал</option>
          <option value="uav">З досвідом БпЛА</option>
          <option value="military">Військових</option>
          <option value="civilian">Цивільних</option>
        </select>
      </label>
      <div class="filter filter--btns">
        <button class="btn small" id="exportBtn" type="button">Експорт CSV</button>
        <button class="btn small" id="refreshBtn" type="button">Оновити</button>
      </div>
    </div>

    <!-- Кандидати -->
    <div id="viewList">
      <div class="stats" id="stats"></div>
      <div class="groups" id="groups"></div>
    </div>

    <!-- Аналітика -->
    <div id="viewStats" hidden>
      <div class="kpis" id="kpis"></div>
      <div class="cards" id="charts"></div>
    </div>
  </section>

</main>

<div id="tip" class="tip" role="tooltip" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" id="modalBackdrop"></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button type="button" class="modal__close" id="modalClose" aria-label="Закрити">×</button>
    <div class="modal__head">
      <div class="ring" id="modalScore"></div>
      <div>
        <h3 id="modalName"></h3>
        <div class="modal__meta" id="modalMeta"></div>
      </div>
    </div>
    <div class="modal__tags" id="modalTags"></div>
    <div class="modal__detail" id="modalDetail"></div>
    <div class="modal__actions">
      <button type="button" class="btn pri" id="modalDocx">Завантажити досьє (.docx)</button>
      <button type="button" class="btn danger" id="modalDelete">Видалити анкету</button>
    </div>
  </div>
</div>

<div class="modal" id="tableModal" hidden>
  <div class="modal__backdrop" id="tableModalBackdrop"></div>
  <div class="modal__box modal__box--wide" role="dialog" aria-modal="true" aria-labelledby="tableModalTitle">
    <button type="button" class="modal__close" id="tableModalClose" aria-label="Закрити">×</button>
    <div class="tmodal__head">
      <h3 id="tableModalTitle"></h3>
      <div class="tmodal__actions">
        <button type="button" class="btn small" id="tableExportBtn">Експорт CSV</button>
        <button type="button" class="btn small" id="tableDocxBtn">Досьє (.docx)</button>
        <button type="button" class="btn small" id="tablePrintBtn">Друк</button>
      </div>
    </div>
    <div class="tmodal__scroll">
      <table class="data-table" id="dataTable"></table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/characteristics.js?v=3"></script>
<script src="js/dossier.js?v=2"></script>
<script src="js/charts.js?v=1"></script>
<script src="js/panel.js?v=6"></script>
</body>
</html>
