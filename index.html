<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3f5e2b" />
<title>Анкета майбутнього пілота БпЛА</title>
<meta name="description" content="Коротка анкета-квест для кандидатів на підготовку пілотів безпілотних авіаційних комплексів: крок за кроком, без реєстрації." />
<link rel="stylesheet" href="css/survey.css?v=5" />
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.2L20 8l-4 4 1 5.6L12 15l-5 2.6 1-5.6-4-4 5.6-.8z"/></svg>
      </span>
      <span>Анкета кандидата<small>підготовка операторів БпЛА</small></span>
    </div>
    <div id="route" class="route" aria-hidden="true" hidden></div>
    <div id="progressWrap" hidden>
      <div class="progress" role="progressbar" aria-label="Прогрес анкети" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div class="progress__fill" id="progressFill"></div></div>
      <div class="progress__meta"><span id="progressStage"></span><span id="progressPct"></span></div>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer class="foot">Відповіді зберігаються на вашому пристрої, доки ви не відправите анкету</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/survey.js?v=5"></script>
</body>
</html>
